      - SELECT "EventChangeLog".* FROM "EventChangeLog" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EventLineItems".* FROM "EventLineItems" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EventMessages".* FROM "EventMessages" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EventMessageReadReceipts".* FROM "EventMessageReadReceipts" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EventSubscriptions".* FROM "EventSubscriptions" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EventTypes".* FROM "EventTypes" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EventTypingIndicators".* FROM "EventTypingIndicators" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "PaymentInstallments".* FROM "PaymentInstallments" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "PriceDurations".* FROM "PriceDurations" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "Prices".* FROM "Prices" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "SalesOffices".* FROM "SalesOffices" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "TermsAndConditions".* FROM "TermsAndConditions" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "ContractSignatures".* FROM "ContractSignatures" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "PaymentHistory".* FROM "PaymentHistory" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EventFiles".* FROM "EventFiles" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "StorageLocations".* FROM "StorageLocations" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EventEmailLog".* FROM "EventEmailLog" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "StripeConnections".* FROM "StripeConnections" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      # Admin: automatic email tables
      - SELECT "EmailTriggerBindings".* FROM "EmailTriggerBindings" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EmailTemplates".* FROM "EmailTemplates" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "EmailTemplateAttachments".* FROM "EmailTemplateAttachments" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "ChangeLog".* FROM "ChangeLog" JOIN "Users" ON "Users"."is_admin" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'

  # Mobile stream: auto-subscribes on connect, gated by connection parameter.
  # Mobile clients connect with params: { app: "mobile" }.
  # Driver-scoped subset to keep devices small.
  #
  # Some of these tables are Postgres views that pre-join/shape data,
  # created in Supabase migrations (see br_next/bleacher_rentals/supabase/migrations).
  mobile:
    auto_subscribe: true
    accept_potentially_dangerous_queries: true
    queries:
      # ── Global reference data (small, needed in full) ──────────────────────
      - SELECT * FROM "AppVersionPolicy" WHERE connection.parameter('app') = 'mobile'
      - SELECT * FROM "UserStatuses" WHERE connection.parameter('app') = 'mobile'
      - SELECT * FROM "InspectionQuestions" WHERE connection.parameter('app') = 'mobile'
      - SELECT * FROM "BlueBook" WHERE connection.parameter('app') = 'mobile'
      # Bleachers: kept global on purpose — the damage-report screen
      # (useAllBleachers) lets a driver file a report against ANY bleacher.
      - SELECT * FROM "Bleachers" WHERE connection.parameter('app') = 'mobile'
      # Users: kept global (small) — used for account-manager / trip-creator
      # name display across screens.
      - SELECT * FROM "Users" WHERE connection.parameter('app') = 'mobile'

      - SELECT * FROM "WorkTrackerTypes" WHERE connection.parameter('app') = 'mobile'

      # ── Scoped to the signed-in driver (Users → Drivers identity chain) ─────
      - SELECT "Drivers".* FROM "Drivers" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "WorkTrackers".* FROM "WorkTrackers" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "WorkTrackerLineItems".* FROM "WorkTrackerLineItems" JOIN "WorkTrackers" ON "WorkTrackers"."id" = "WorkTrackerLineItems"."work_tracker_uuid" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "DriverUnavailability".* FROM "DriverUnavailability" JOIN "Drivers" ON "Drivers"."id" = "DriverUnavailability"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "DriverPayRanges".* FROM "DriverPayRanges" JOIN "Drivers" ON "Drivers"."id" = "DriverPayRanges"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "Vehicles".* FROM "Vehicles" JOIN "Drivers" ON "Drivers"."vehicle_uuid" = "Vehicles"."id" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "AccountManagers".* FROM "AccountManagers" JOIN "Drivers" ON "Drivers"."account_manager_uuid" = "AccountManagers"."id" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      # DriverDocuments: license / insurance / medical card rows for the custom
      # photo upload queue — the driver's own only.
      - SELECT "DriverDocuments".* FROM "DriverDocuments" JOIN "Drivers" ON "Drivers"."id" = "DriverDocuments"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()

      # ── Addresses: pickup + dropoff of the driver's trips, and own address ──
      - SELECT "Addresses".* FROM "Addresses" JOIN "WorkTrackers" ON "WorkTrackers"."pickup_address_uuid" = "Addresses"."id" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "Addresses".* FROM "Addresses" JOIN "WorkTrackers" ON "WorkTrackers"."dropoff_address_uuid" = "Addresses"."id" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "Addresses".* FROM "Addresses" JOIN "Drivers" ON "Drivers"."address_uuid" = "Addresses"."id" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()

      # ── Contacts: the on-site POC on the driver's own trips, both legs ─────
      # Scoped through WorkTrackers, exactly like Addresses above: only the
      # contacts this driver's own trips point at reach the device. The wider
      # customer contact book — every client contact in the business — must
      # never sync to a driver's phone.
      - SELECT "Contacts".* FROM "Contacts" JOIN "WorkTrackers" ON "WorkTrackers"."pickup_poc_contact_uuid" = "Contacts"."id" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "Contacts".* FROM "Contacts" JOIN "WorkTrackers" ON "WorkTrackers"."dropoff_poc_contact_uuid" = "Contacts"."id" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()

      # ── Inspections + their photos: the driver's own trip inspections ───────
      - SELECT "WorkTrackerInspections".* FROM "WorkTrackerInspections" JOIN "WorkTrackers" ON "WorkTrackers"."pre_inspection_uuid" = "WorkTrackerInspections"."id" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "WorkTrackerInspections".* FROM "WorkTrackerInspections" JOIN "WorkTrackers" ON "WorkTrackers"."post_inspection_uuid" = "WorkTrackerInspections"."id" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "InspectionPhotos".* FROM "InspectionPhotos" JOIN "WorkTrackers" ON "WorkTrackers"."pre_inspection_uuid" = "InspectionPhotos"."inspection_uuid" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      - SELECT "InspectionPhotos".* FROM "InspectionPhotos" JOIN "WorkTrackers" ON "WorkTrackers"."post_inspection_uuid" = "InspectionPhotos"."inspection_uuid" JOIN "Drivers" ON "Drivers"."id" = "WorkTrackers"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()

      # ── Damage reports: all UNRESOLVED (so any bleacher's open damage shows
      #    offline during inspection) + everything the driver created (history) ─
      - SELECT * FROM "DamageReports" WHERE connection.parameter('app') = 'mobile' AND "resolved_at" IS NULL
      - SELECT "DamageReports".* FROM "DamageReports" JOIN "Users" ON "Users"."id" = "DamageReports"."created_by_user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()
      # Damage photos follow the same two sets.
      #
      # No join, deliberately. Reaching the parent for `resolved_at` compiled
      # into a parameter query returning one row per open report, capped at
      # 1000: at 1018 open reports every driver's first sync failed with
      # PSYNC_S2305 and the app sat on PoorConnectionScreen. The count is
      # company-wide and only grows, so there was no version of that query that
      # stayed under the cap.
      #
      # `report_resolved_at` mirrors the parent onto the photo row, maintained
      # by triggers (supabase/migrations/20260902120000_damage_report_photos_report_resolved_at.sql),
      # so this reads like the DamageReports rule above it and has no ceiling.
      #
      # `damage_report_uuid IS NOT NULL` preserves what the join did on its own:
      # the column is nullable, and a parented-nowhere photo used to match no
      # report and reach no device. Without this it would mirror NULL — "open" —
      # and sync to every phone.

      # Old one:
      # - SELECT "DamageReportPhotos".* FROM "DamageReportPhotos" JOIN "DamageReports" ON "DamageReports"."id" = "DamageReportPhotos"."damage_report_uuid" WHERE connection.parameter('app') = 'mobile' AND "DamageReports"."resolved_at" IS NULL
      - SELECT * FROM "DamageReportPhotos" WHERE connection.parameter('app') = 'mobile' AND "report_resolved_at" IS NULL AND "damage_report_uuid" IS NOT NULL
      - SELECT "DamageReportPhotos".* FROM "DamageReportPhotos" JOIN "DamageReports" ON "DamageReports"."id" = "DamageReportPhotos"."damage_report_uuid" JOIN "Users" ON "Users"."id" = "DamageReports"."created_by_user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()

      # ── Damage report acknowledgements ("select all that apply") ───────────
      # A driver confirming an existing report instead of filing a duplicate.
      # Synced for every OPEN report, not just this driver's: the count they
      # see ("confirmed by 3 drivers") is what stops a fourth report, and it is
      # worthless if it only counts themselves.
      #
      # `report_resolved_at` is the mirrored parent column, for the same reason
      # the photo rule above uses one: reaching the parent through a JOIN
      # compiles into a parameter query capped at 1000 rows, which is how first
      # sync broke at ~1000 open reports (PSYNC_S2305). Rows are ~100 bytes and
      # carry no photos, so the whole open set is a rounding error on a phone.
      - SELECT * FROM "DamageReportAcknowledgements" WHERE connection.parameter('app') = 'mobile' AND "report_resolved_at" IS NULL AND "deleted" = false

      # ── Backlog tickets ("Direct Line to Developers") ───────────────────────
      # RoadmapTasks is the developers' whole board — features, sprints,
      # assignees. Only the backlog tickets THIS driver filed may reach a phone.
      #
      # Soft-deleted rows are deliberately NOT filtered out here. The app's
      # daily create limit (3 per rolling 24h) counts tickets created, withdrawn
      # ones included, and has to match the Postgres trigger exactly — a client
      # that counted looser would let through a write the server rejects, and
      # PowerSync drops a rejected write silently. The list screen filters
      # `deleted_at IS NULL` itself.
      - SELECT "RoadmapTasks".* FROM "RoadmapTasks" JOIN "Users" ON "Users"."id" = "RoadmapTasks"."created_by_user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id() AND "RoadmapTasks"."is_backlog" = true
      #
      # The authorship notices the app posts alongside each ticket (created,
      # edited, withdrawn — see features/backlog-tickets/utils/ticketNoticeInsert.ts
      # in br_driver). Two filters, both load-bearing:
      #
      #   `user_uuid` = this driver, so only the driver's OWN notices come back.
      #   `is_system` = true for the same reason from the other side. The rest of
      #   the thread is the developers' conversation about the ticket, and
      #   drivers are deliberately never shown ticket status — a reply landing on
      #   a phone that has no UI for it is at best invisible and at worst a
      #   promise the product does not make.
      #
      # The device never reads this table; the app writes it and moves on. The
      # rows come back only so a phone's local database matches what Postgres
      # actually accepted, rather than holding writes that quietly vanish at the
      # next checkpoint.
      - SELECT "RoadmapTaskMessages".* FROM "RoadmapTaskMessages" JOIN "RoadmapTasks" ON "RoadmapTasks"."id" = "RoadmapTaskMessages"."task_id" JOIN "Users" ON "Users"."id" = "RoadmapTaskMessages"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id() AND "RoadmapTasks"."is_backlog" = true AND "RoadmapTaskMessages"."is_system" = true

      # ── Driver Satisfaction Score ──────────────────────────────────────────
      # The survey the driver cannot dismiss. Definitions are reference data —
      # small, and needed in full so the question can be asked with the phone
      # offline. Only ACTIVE ones sync: a retired survey must stop prompting.
      - SELECT * FROM "DriverSurveys" WHERE connection.parameter('app') = 'mobile' AND "is_active" = true
      - SELECT "DriverSurveyQuestions".* FROM "DriverSurveyQuestions" JOIN "DriverSurveys" ON "DriverSurveys"."id" = "DriverSurveyQuestions"."survey_uuid" WHERE connection.parameter('app') = 'mobile' AND "DriverSurveys"."is_active" = true AND "DriverSurveyQuestions"."is_active" = true
      #
      # The driver's own answers, for ALL time and never filtered by date. One
      # row per question answered — there is no submission parent table, so
      # this single query is the whole of a driver's survey history, and it is
      # the app's entire memory of when it last asked: the gate compares
      # `max(submitted_at)` against the survey's `interval_days`. Narrow this
      # window and a driver whose last answer fell outside it is asked again the
      # next morning, forever.
      - SELECT "DriverSurveyResponses".* FROM "DriverSurveyResponses" JOIN "Drivers" ON "Drivers"."id" = "DriverSurveyResponses"."driver_uuid" JOIN "Users" ON "Users"."id" = "Drivers"."user_uuid" WHERE connection.parameter('app') = 'mobile' AND "Users"."clerk_user_id" = auth.user_id()

      # ── Removed (synced to every device but never read by the app): ─────────
      #   BleacherEvents, BleacherUsers, Blocks, Events, HomeBases, Tasks,
      #   TaskStatuses, TaskTypes, UserHomeBases, UserRoles
