# See Documentation for more information:
# https://docs.powersync.com/sync/streams/overview
#
# Note that changes to this file are not watched.
# The service needs to be restarted for changes to take effect.

config:
  edition: 3

streams:
  # Web stream: Zero Trust — nothing syncs unless a role check passes.
  # Web clients connect with params: { app: "web" }.
  # Inactive users (status_uuid = '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5') are blocked
  # from all data except their own Users row and UserStatuses reference data.
  web:
    auto_subscribe: true
    accept_potentially_dangerous_queries: true
    queries:
      # Identity tables: needed by useUserAccess to determine role.
      # Users self-row: always synced (inactive users need this to detect deactivation)
      - SELECT * FROM "Users" WHERE connection.parameter('app') = 'web' AND clerk_user_id = auth.user_id()
      # AccountManagers/Developers: blocked for inactive users
      - SELECT "AccountManagers".* FROM "AccountManagers" JOIN "Users" ON "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5' WHERE connection.parameter('app') = 'web'
      - SELECT "Developers".* FROM "Developers" JOIN "Users" ON "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5' WHERE connection.parameter('app') = 'web'
      - SELECT "Maintainers".* FROM "Maintainers" JOIN "Users" ON "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5' WHERE connection.parameter('app') = 'web'
      # UserStatuses: reference data, always synced (needed to interpret status_uuid)
      - SELECT * FROM "UserStatuses" WHERE connection.parameter('app') = 'web'
      # AppVersionPolicy: reference data, synced for all users
      - SELECT * FROM "AppVersionPolicy" WHERE connection.parameter('app') = 'web'

      # Dashboard filter settings: each user sees only their own row
      - SELECT "DashboardFilterSettings".* FROM "DashboardFilterSettings" JOIN "Users" ON "DashboardFilterSettings"."user_uuid" = "Users"."id" WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'

      # Viewer tables: is_viewer gets read-only access (write blocked by RLS)
      - SELECT "Zones".* FROM "Zones" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "AccountManagerZones".* FROM "AccountManagerZones" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "Addresses".* FROM "Addresses" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "BleacherAnnualInspections".* FROM "BleacherAnnualInspections" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "BleacherEvents".* FROM "BleacherEvents" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "BleacherMaintEvents".* FROM "BleacherMaintEvents" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "Bleachers".* FROM "Bleachers" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "Blocks".* FROM "Blocks" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
      - SELECT "DamageReports".* FROM "DamageReports" JOIN "Users" ON "Users"."is_viewer" = true WHERE connection.parameter('app') = 'web' AND "Users"."clerk_user_id" = auth.user_id() AND "Users"."status_uuid" != '7b65d5a1-8ee0-4b7a-816d-d3ec1ed123c5'
